<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机端 · 现场注册</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="mobile-register">
<div class="mobile-stage">
  <div class="phone" id="formPhone">
    <div class="scr">
      <div class="m-head">
        <div style="font-size:12.5px;opacity:.92" id="mregEv"></div>
        <div class="t">现场注册</div>
        <div class="s">请填写以下信息，提交后请与工作人员确认桌号</div>
      </div>
      <form class="m-form" id="mregForm" autocomplete="off">
        <div class="field"><label>姓名<span class="req">*</span></label><input class="input" name="name" placeholder="请输入姓名"></div>
        <div class="field"><label>公司 / 部门<span class="req">*</span></label><input class="input" name="company" placeholder="请输入公司或部门"></div>
        <div class="field"><label>手机号<span class="req">*</span></label><input class="input" name="phone" inputmode="numeric" placeholder="11 位手机号"></div>
        <div class="field"><label>职务<span class="req">*</span></label><input class="input" name="title" placeholder="请输入职务"></div>
        <div class="field"><label>类别</label><select class="select" name="category"><option value="">请选择</option><option>VIP</option><option>Non-VIP</option><option>内部陪同</option><option>未分类</option></select></div>
        <div class="field"><label>备注</label><textarea class="textarea" name="note" placeholder="需要说明的情况可写在这里"></textarea></div>
        <div class="note info" style="font-size:12.5px"><i></i><div>同一姓名 + 公司／部门只会建档一次，重复提交会合并到原记录。</div></div>
        <button class="btn primary lg block" type="submit">提 交 注 册</button>
        <p class="small muted center" style="margin:2px 0 8px">提交后工作人员会为你分配桌号并打印标签</p>
      </form>
      <div class="modal-stage" id="mregModal" style="display:none">
        <div class="modal">
          <div class="ok-ring">✓</div>
          <h4 id="modalTitle">注册成功，请与工作人员确认桌号</h4>
          <p id="modalText"></p>
          <button class="btn primary block" id="modalOk">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <div class="phone" id="resultPhone">
    <div class="scr">
      <div id="mregResult" style="height:100%;display:none"></div>
      <div id="regEmpty" style="height:100%;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;color:var(--muted);font-size:13.5px">
        提交后会在这里显示你的签到二维码，以及工作人员确认的桌号。
      </div>
    </div>
  </div>

  <div class="m-note">
    <h3>新人扫码自助注册</h3>
    <ul>
      <li>必填：姓名、公司／部门、手机号、职务；类别与备注选填</li>
      <li>提交后弹出「注册成功，请与工作人员确认桌号」，同时信息进入后台现场注册列表</li>
      <li>工作人员填完桌号确认后，直接打印一张标签贴在胸卡上</li>
      <li>注册不等于签到：工作人员或本人用生成的二维码再扫一次才算到场</li>
    </ul>
    <div class="row">
      <a class="btn sm ghost" href="register-qr.html">看注册二维码页</a>
      <a class="btn sm" href="admin-onsite.html">看后台现场注册记录</a>
    </div>
  </div>
</div>
<script src="lan.js"></script>
<script src="assets/store.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/print.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages-kiosk.js"></script>
<script src="assets/pages-mobile.js"></script>
<script src="assets/pages-admin.js"></script>
</body>
</html>
