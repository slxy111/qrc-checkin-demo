<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>签到台 · 现场注册</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="kiosk-register">
<div class="kiosk">
  <div class="k-top">
    <div class="ev">现场注册 <span>· 工作人员代录 / 新人扫码自助注册</span></div>
    <div class="right">
      <span class="selsm" style="padding:0"><select id="kioskEventPick" class="select" style="border:0;background:transparent;padding:7px 10px;font-size:13px"></select></span>
      <a class="btn lg" href="kiosk-checkin.html">返回签到</a>
      <a class="btn lg ghost" id="sideLink" href="register-qr.html">放大注册二维码</a>
    </div>
  </div>

  <div class="split" style="align-items:start">
    <div class="card" style="background:#fff">
      <div class="hd"><h3 style="font-size:17px">填写人员信息</h3><span class="hint">注册只建档并生成二维码，扫码后才算签到</span></div>
      <div class="bd">
        <form class="form" id="regForm" autocomplete="off">
          <div class="g g2">
            <div class="field"><label>姓名<span class="req">*</span></label><input class="input" name="name" placeholder="请输入姓名"></div>
            <div class="field"><label>公司 / 部门<span class="req">*</span></label><input class="input" name="company" placeholder="请输入公司或部门"></div>
          </div>
          <div class="g g2">
            <div class="field"><label>手机号<span class="req">*</span></label><input class="input" name="phone" placeholder="11 位手机号"></div>
            <div class="field"><label>桌号</label><input class="input" name="table" placeholder="可为空，稍后补录"></div>
          </div>
          <div class="g g3">
            <div class="field"><label>类别</label><select class="select" name="category"><option value="">请选择</option><option>VIP</option><option>Non-VIP</option><option>内部陪同</option><option>未分类</option></select></div>
            <div class="field"><label>职务<span class="req">*</span></label><input class="input" name="title" placeholder="请输入职务"></div>
            <div class="field"><label>负责销售</label><input class="input" name="sales" placeholder="选填"></div>
          </div>
          <div class="field"><label>备注</label><textarea class="textarea" name="note" placeholder="可填写备注"></textarea></div>
          <div class="note warn"><i></i><div>提交时按「姓名 + 公司／部门」判定是否已存在：已存在则合并更新原记录，不重复建档。</div></div>
          <div class="row" style="justify-content:flex-end">
            <button class="btn lg" type="reset">清空</button>
            <button class="btn primary lg" type="submit" style="padding:14px 30px;font-size:18px">提交并生成二维码</button>
          </div>
        </form>
      </div>
    </div>

    <div class="stack">
      <div class="card" id="regOut" style="display:none"></div>

      <div class="card" style="background:#fff">
        <div class="hd"><h3 style="font-size:17px">新人自助注册二维码</h3><span class="hint">签到台展示，新人扫码填写</span></div>
        <div class="bd" style="display:flex;gap:20px;align-items:center">
          <div class="qr-holder" id="sideQr"></div>
          <div class="stack" style="gap:6px">
            <div style="font-size:15px;font-weight:600">扫码打开手机注册表单</div>
            <div class="small muted">新人自己填写姓名、公司/部门、手机号与职务，提交后后台现场注册列表实时出现该人员。</div>
            <div class="small">链接：<span class="code-chip" id="sideUrl"></span></div>
            <div class="row">
              <a class="btn lg" href="register-qr.html">放大展示</a>
              <a class="btn lg ghost" href="mobile-register.html" target="_blank">预览手机表单</a>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="background:#fff">
        <div class="hd"><h3>本次现场注册</h3><span class="hint">实时刷新</span></div>
        <div class="k-list" style="box-shadow:none">
          <div class="lh"><span>姓名</span><span>公司 / 部门</span><span>桌号</span><span>类别</span><span>状态</span><span>时间</span></div>
          <div id="regList"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="lan.js"></script>
<script src="assets/store.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/print.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages-kiosk.js"></script>
<script src="assets/pages-mobile.js"></script>
<script src="assets/pages-admin.js"></script>
</body>
</html>
