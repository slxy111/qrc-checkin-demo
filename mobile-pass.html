<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机端 · 个人二维码页</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="mobile-pass" data-mode="link">
<div class="mobile-stage">
  <div class="phone">
    <div class="scr">
      <div id="passBox" style="height:100%;display:none"></div>
      <div class="card" id="queryCard" style="border:0;height:100%;display:flex;flex-direction:column;justify-content:center;padding:26px 22px">
        <div class="center">
          <div style="font-size:13px;color:var(--muted)">活动名称占位</div>
          <h3 style="font-size:19px;margin-top:6px">输入手机号查询二维码</h3>
          <p class="small muted">没收到短信或找不到链接时用这里</p>
        </div>
        <form id="queryForm" class="mt">
          <div class="field"><label>手机号</label><input class="input" name="phone" inputmode="numeric" placeholder="报名时填写的手机号" style="height:52px;font-size:18px"></div>
          <button class="btn primary lg block mt-s" type="submit">查 询</button>
        </form>
      </div>
    </div>
  </div>

  <div class="m-note" style="max-width:420px">
    <h3>个人二维码页</h3>
    <div class="row" id="hintBar" style="margin-bottom:12px"></div>
    <ul>
      <li>从短信里的专属链接打开时，页面直接显示本人姓名、桌号与二维码</li>
      <li>不带参数打开时进入查询模式：输入手机号即可查到自己的二维码</li>
      <li>二维码由系统本机生成，四角完整、四周留白，方便扫码枪一次识别</li>
      <li>页面只用于展示，签到由工作人员扫码完成</li>
    </ul>
    <div class="row">
      <a class="btn sm ghost" href="mobile-query.html">手机号查询模式</a>
      <a class="btn sm ghost" href="admin-passpage.html">在后台配置此页面</a>
    </div>
  </div>
</div>
<script src="lan.js"></script>
<script src="assets/store.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/print.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages-kiosk.js"></script>
<script src="assets/pages-mobile.js"></script>
<script src="assets/pages-admin.js"></script>
</body>
</html>
